name: testerloop
description: Zero-code Flutter plugin wrapping the TesterLoop Android closed-testing verification SDK.
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.testerloop.flutter
        pluginClass: TesterLoopPlugin
